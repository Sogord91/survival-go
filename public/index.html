<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival GO - Multiplayer Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Socket.io client -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #111; color: #eee; font-family: monospace; }
        #map { height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; z-index: 1; }
        .hud-panel { z-index: 1000; background: rgba(17, 24, 39, 0.94); backdrop-filter: blur(8px); }
        .modal { z-index: 2000; background: rgba(0, 0, 0, 0.9); }
        .leaflet-bottom { bottom: 80px !important; }
        #toast-notification { transition: opacity 0.3s ease-in-out; z-index: 9999; }
    </style>
</head>
<body class="overflow-hidden">

    <!-- BEJELENTKEZÉS / REGISZTRÁCIÓ MODAL -->
    <div id="login-modal" class="fixed inset-0 modal flex items-center justify-center p-4 z-[9999]">
        <div class="bg-gray-900 border border-amber-500/50 w-full max-w-md rounded-2xl p-6 shadow-2xl text-center">
            <h2 class="text-lg font-bold text-amber-400 mb-1">☢️ Survival GO Multiplayer</h2>
            <p class="text-xs text-gray-400 mb-4">Add meg a túlélő adatait a belépéshez vagy regisztrációhoz:</p>
            
            <div id="avatar-container" class="flex justify-center gap-3 mb-4">
                <div class="avatar-option cursor-pointer text-2xl p-2 bg-gray-800 border-2 border-amber-500 rounded-xl hover:bg-gray-700 transition-all" data-avatar="🥷" onclick="selectAvatar('🥷')">🥷</div>
                <div class="avatar-option cursor-pointer text-2xl p-2 bg-gray-800 border-2 border-transparent rounded-xl hover:bg-gray-700 transition-all" data-avatar="🪖" onclick="selectAvatar('🪖')">🪖</div>
                <div class="avatar-option cursor-pointer text-2xl p-2 bg-gray-800 border-2 border-transparent rounded-xl hover:bg-gray-700 transition-all" data-avatar="🦺" onclick="selectAvatar('🦺')">🦺</div>
                <div class="avatar-option cursor-pointer text-2xl p-2 bg-gray-800 border-2 border-transparent rounded-xl hover:bg-gray-700 transition-all" data-avatar="💀" onclick="selectAvatar('💀')">💀</div>
            </div>

            <input type="text" id="username-input" placeholder="Túlélő Neve" class="w-full bg-gray-800 border border-gray-600 rounded-xl px-3 py-2 text-sm text-white mb-3 focus:outline-none focus:border-amber-500 text-center font-bold">
            <input type="password" id="password-input" placeholder="Jelszó" class="w-full bg-gray-800 border border-gray-600 rounded-xl px-3 py-2 text-sm text-white mb-4 focus:outline-none focus:border-amber-500 text-center font-bold">
            
            <div class="flex gap-2">
                <button id="btn-register" class="w-1/2 bg-gray-700 hover:bg-gray-600 text-amber-300 font-bold py-2.5 rounded-xl text-xs transition-all border border-gray-600">Regisztráció</button>
                <button id="btn-login" class="w-1/2 bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-lg">Bejelentkezés</button>
            </div>
        </div>
    </div>

    <!-- TÉRKÉP KONTÉNER -->
    <div id="map"></div>

    <!-- ÉRTESÍTŐ TOAST -->
    <div id="toast-notification" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-900/95 border border-amber-500/80 text-amber-300 px-4 py-2 rounded-xl text-xs font-bold shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300 text-center max-w-sm">
        Üzenet helye
    </div>

    <!-- TELJES RÉSZLETES HUD (FELSŐ SÁV) -->
    <div class="absolute top-4 left-4 right-4 flex flex-col md:flex-row justify-between items-center hud-panel p-3 rounded-2xl border border-gray-700 shadow-2xl gap-3">
        <div class="flex items-center gap-3">
            <div id="hud-avatar" class="text-3xl bg-gray-800 p-2 rounded-xl border border-gray-600 shadow-inner">🥷</div>
            <div>
                <div id="hud-name" class="text-xs font-bold text-amber-400">Stalker</div>
                <div class="text-[10px] text-gray-400">Szint: <span id="hud-level" class="text-white font-bold">1</span> (XP: <span id="hud-xp">0</span>) | 🛡️ Védelem: <span id="hud-def" class="text-cyan-400 font-bold">0</span> | ⚖️ Súly: <span id="hud-weight" class="text-amber-300 font-bold">0.0 / 30 kg</span></div>
            </div>
        </div>

        <div class="flex items-center gap-4 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
            <div class="flex flex-col min-w-[90px]">
                <div class="flex justify-between text-[10px] mb-0.5 text-gray-300 font-bold">
                    <span>❤️ Élet</span>
                    <span id="hud-hp-text">100/100</span>
                </div>
                <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden border border-gray-700">
                    <div id="hud-hp-bar" class="bg-red-600 h-full transition-all duration-300" style="width: 100%"></div>
                </div>
            </div>
            <div class="flex flex-col min-w-[80px]">
                <div class="flex justify-between text-[10px] mb-0.5 text-gray-300 font-bold">
                    <span>🍖 Éhség</span>
                    <span id="hud-hunger-text">100%</span>
                </div>
                <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden border border-gray-700">
                    <div id="hud-hunger-bar" class="bg-amber-500 h-full transition-all duration-300" style="width: 100%"></div>
                </div>
            </div>
            <div class="flex flex-col min-w-[80px]">
                <div class="flex justify-between text-[10px] mb-0.5 text-gray-300 font-bold">
                    <span>💧 Szomjúság</span>
                    <span id="hud-thirst-text">100%</span>
                </div>
                <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden border border-gray-700">
                    <div id="hud-thirst-bar" class="bg-blue-500 h-full transition-all duration-300" style="width: 100%"></div>
                </div>
            </div>
            <div class="flex flex-col min-w-[80px]">
                <div class="flex justify-between text-[10px] mb-0.5 text-gray-300 font-bold">
                    <span>⚡ Fáradtság</span>
                    <span id="hud-fatigue-text">0%</span>
                </div>
                <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden border border-gray-700">
                    <div id="hud-fatigue-bar" class="bg-yellow-500 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ALSÓ VEZÉRLŐSÁV -->
    <div class="absolute bottom-4 left-4 right-4 flex justify-between items-center hud-panel px-4 py-3 rounded-2xl border border-gray-700 shadow-2xl">
        <div class="text-xs text-gray-400">Online Túlélők: <span id="online-count" class="text-emerald-400 font-bold">1</span></div>
        <div class="flex gap-2">
            <button onclick="openInventoryModal()" class="bg-gray-800 hover:bg-gray-700 text-amber-300 border border-amber-500/50 px-3 py-1.5 rounded-xl text-xs font-bold transition-all shadow">🎒 Inventory</button>
        </div>
    </div>

    <!-- INVENTORY MODAL -->
    <div id="inventory-modal" class="fixed inset-0 modal hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-amber-500/50 w-full max-w-lg rounded-2xl p-6 shadow-2xl relative max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold text-amber-400">🎒 Túlélő Felszerelése és Táska</h3>
                <button onclick="closeInventoryModal()" class="text-gray-400 hover:text-white font-bold text-sm">✕</button>
            </div>
            <div id="inventory-grid" class="grid grid-cols-4 gap-2 text-xs">
                <!-- Dinamikus tartalom -->
            </div>
        </div>
    </div>

    <!-- SCRIPT IMPORT ÉS FŐ LOGIKA -->
    <script src="/js/config.js"></script>
    <script>
        const socket = io();
        let currentUsername = "";
        let player = {
            username: "Stalker",
            avatar: "🥷",
            hp: 100,
            maxHp: 100,
            hunger: 100,
            thirst: 100,
            fatigue: 0,
            level: 1,
            xp: 0,
            inventory: [],
            equipment: { helmet: null, torso: null, armor: null, legs: null, shoes: null, backpack: null, weapon: null },
            lat: 47.4979,
            lng: 19.0402
        };

        let map = null;
        let playerMarker = null;
        let otherPlayerMarkers = {};
        let buildingMarkers = {};

        function logMessage(text) {
            const toast = document.getElementById('toast-notification');
            if(toast) {
                toast.textContent = text;
                toast.classList.remove('opacity-0');
                if (window.toastTimeout) clearTimeout(window.toastTimeout);
                window.toastTimeout = setTimeout(() => { toast.classList.add('opacity-0'); }, 3500);
            }
        }

        let selectedAvatar = '🥷';
        function selectAvatar(avatar) {
            selectedAvatar = avatar;
            document.querySelectorAll('.avatar-option').forEach(el => {
                el.classList.remove('border-amber-500');
                el.classList.add('border-transparent');
                if(el.getAttribute('data-avatar') === avatar) {
                    el.classList.remove('border-transparent');
                    el.classList.add('border-amber-500');
                }
            });
        }

        // --- AUTH API ---
        document.getElementById('btn-register').addEventListener('click', async () => {
            const username = document.getElementById('username-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            if (!username || !password) { alert('Add meg a nevet és jelszót!'); return; }

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, avatar: selectedAvatar })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) { loginUserQuick(username, password); }
        });

        document.getElementById('btn-login').addEventListener('click', async () => {
            const username = document.getElementById('username-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            if (!username || !password) { alert('Add meg a nevet és jelszót!'); return; }

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                player = data.player;
                currentUsername = username;
                document.getElementById('login-modal').classList.add('hidden');
                initGameSession();
            } else {
                alert(data.message);
            }
        });

        async function loginUserQuick(username, password) {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                player = data.player;
                currentUsername = username;
                document.getElementById('login-modal').classList.add('hidden');
                initGameSession();
            }
        }

        function initGameSession() {
            updateHUD();
            socket.emit('player_join', { username: player.username, avatar: player.avatar, lat: player.lat || 47.4979, lng: player.lng || 19.0402 });

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    initMap(pos.coords.latitude, pos.coords.longitude);
                }, () => { initMap(player.lat || 47.4979, player.lng || 19.0402); }, { enableHighAccuracy: true });
            } else {
                initMap(player.lat || 47.4979, player.lng || 19.0402);
            }
        }

        function updateHUD() {
            document.getElementById('hud-name').textContent = player.username;
            document.getElementById('hud-avatar').textContent = player.avatar;
            document.getElementById('hud-level').textContent = player.level;
            document.getElementById('hud-xp').textContent = player.xp || 0;
            document.getElementById('hud-hp-text').textContent = `${player.hp}/${player.maxHp}`;
            document.getElementById('hud-hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
            document.getElementById('hud-hunger-text').textContent = `${player.hunger}%`;
            document.getElementById('hud-hunger-bar').style.width = `${player.hunger}%`;
            document.getElementById('hud-thirst-text').textContent = `${player.thirst}%`;
            document.getElementById('hud-thirst-bar').style.width = `${player.thirst}%`;
            document.getElementById('hud-fatigue-text').textContent = `${player.fatigue}%`;
            document.getElementById('hud-fatigue-bar').style.width = `${player.fatigue}%`;

            let totalWeight = 0;
            let totalDef = 0;
            if (player.equipment) {
                for (let slot in player.equipment) {
                    const itemKey = player.equipment[slot];
                    if (itemKey && itemDatabase[itemKey]) {
                        totalWeight += itemDatabase[itemKey].weight || 0;
                        totalDef += itemDatabase[itemKey].def || 0;
                    }
                }
            }
            if (player.inventory) {
                player.inventory.forEach(i => {
                    if (itemDatabase[i.key]) {
                        totalWeight += (itemDatabase[i.key].weight || 0) * (i.count || 1);
                    }
                });
            }
            document.getElementById('hud-def').textContent = totalDef;
            document.getElementById('hud-weight').textContent = `${totalWeight.toFixed(1)} / 30 kg`;
        }

        function initMap(lat, lng) {
            if (map) return;
            map = L.map('map').setView([lat, lng], 17);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            const icon = L.divIcon({
                className: 'custom-player-icon',
                html: `<div style="font-size: 26px; text-align: center;">${player.avatar}</div>`,
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
            playerMarker = L.marker([lat, lng], {icon: icon}).addTo(map);

            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(position => {
                    const nLat = position.coords.latitude;
                    const nLng = position.coords.longitude;
                    playerMarker.setLatLng([nLat, nLng]);
                    socket.emit('player_move', { lat: nLat, lng: nLng });
                }, null, { enableHighAccuracy: true });
            }
            logMessage('Üdv a Zónában, túlélő!');
        }

        function openInventoryModal() {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = '';
            if (player.inventory && player.inventory.length > 0) {
                player.inventory.forEach((item) => {
                    const itemDef = itemDatabase[item.key] || { name: item.key, icon: '📦' };
                    grid.innerHTML += `
                        <div class="bg-gray-800 p-2 rounded-xl border border-gray-700 flex flex-col items-center text-center">
                            <span class="text-xl">${itemDef.icon}</span>
                            <span class="text-[10px] text-gray-300 font-bold truncate w-full">${itemDef.name}</span>
                            <span class="text-[9px] text-amber-400">Db: ${item.count || 1}</span>
                        </div>
                    `;
                });
            } else {
                grid.innerHTML = `<div class="col-span-4 text-center text-gray-500 py-4 text-xs">Az inventory üres.</div>`;
            }
            document.getElementById('inventory-modal').classList.remove('hidden');
        }

        function closeInventoryModal() {
            document.getElementById('inventory-modal').classList.add('hidden');
        }

        // --- POI / ÉPÜLETEK SZINKRONIZÁLÁSA ÉS LOOTOLÁSA ---
        socket.on('sync_world', (buildings) => {
            for (let id in buildingMarkers) {
                map.removeLayer(buildingMarkers[id]);
            }
            buildingMarkers = {};

            buildings.forEach(b => {
                let iconHtml = '🏠';
                let colorClass = 'bg-gray-700';
                
                if (b.type === 'military' || b.type === 'bunker') {
                    iconHtml = '🛡️';
                    colorClass = 'bg-red-800';
                } else if (b.type === 'hospital') {
                    iconHtml = '🏥';
                    colorClass = 'bg-blue-800';
                } else if (b.type === 'store' || b.type === 'gas_station') {
                    iconHtml = '🛒';
                    colorClass = 'bg-amber-700';
                }

                if (b.isLooted) {
                    iconHtml = '📭';
                    colorClass = 'bg-gray-900 opacity-50';
                }

                const icon = L.divIcon({
                    className: 'poi-icon',
                    html: `<div class="${colorClass} p-1 rounded-xl text-center border border-amber-500/50 shadow-lg" style="font-size: 18px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;" title="${b.name} (${b.type})">${iconHtml}</div>`,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });

                const marker = L.marker([b.lat, b.lng], { icon: icon }).addTo(map);

                marker.on('click', () => {
                    const playerLatLng = playerMarker.getLatLng();
                    const distance = playerLatLng.distanceTo([b.lat, b.lng]);

                    // Teszteléshez most megemeltük a távolságot 500 méterre, hogy könnyen elérhesd a térképen
                    if (distance > 500) {
                        logMessage('⚠️ Túl messze vagy az épülettől!');
                        return;
                    }

                    if (b.isLooted) {
                        logMessage('⚠️ Ezt az épületet már kirámolták.');
                        return;
                    }

                    socket.emit('request_loot', { username: player.username, buildingId: b._id });
                });

                buildingMarkers[b._id] = marker;
            });
        });

        socket.on('loot_result', (res) => {
            logMessage(res.message);
            if (res.success && res.player) {
                player.level = res.player.level;
                player.xp = res.player.xp;
                player.inventory = res.player.inventory;
                updateHUD();
            }
        });

        socket.on('update_players', (players) => {
            let count = 0;
            for (let id in players) {
                const p = players[id];
                if (p.username === player.username) continue;
                count++;

                if (!otherPlayerMarkers[id]) {
                    const icon = L.divIcon({
                        className: 'other-player',
                        html: `<div style="font-size: 20px; text-align: center;" title="${p.username}">${p.avatar}</div>`,
                        iconSize: [25, 25]
                    });
                    otherPlayerMarkers[id] = L.marker([p.lat, p.lng], {icon: icon}).addTo(map);
                } else {
                    otherPlayerMarkers[id].setLatLng([p.lat, p.lng]);
                }
            }
            for (let id in otherPlayerMarkers) {
                if (!players[id]) {
                    map.removeLayer(otherPlayerMarkers[id]);
                    delete otherPlayerMarkers[id];
                }
            }
            document.getElementById('online-count').textContent = count + 1;
        });
    </script>
</body>
</html>
