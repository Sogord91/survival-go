<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survival GO Wiki – tárgyak, receptek, ellenfelek, útmutatók</title>
<meta name="description" content="A Survival GO magyar GPS-túlélőjáték wikije: útmutatók kezdőknek, minden tárgy, barkácsrecept, ellenfél és épülettípus.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Share+Tech+Mono&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root { --bg: #14160f; --panel: #22261a; --panel2: #2b3021; --line: #3d4430; --text: #e9e3cf; --muted: #a39d89; --gold: #d9c58a; --green: #8fa64a; --red: #c9533f; --paper: #ece6d6; --ink: #2a2620;
  --font: 'Barlow Condensed', 'Arial Narrow', sans-serif; --mono: 'Share Tech Mono', ui-monospace, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 500 17px/1.5 var(--font); }
body { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 6px, transparent 6px 12px); }
a { color: var(--gold); text-decoration: none; } a:hover { text-decoration: underline; }
header { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: rgba(14,16,11,.97); border-bottom: 1px solid var(--line); }
header .logo { display: flex; align-items: center; gap: 10px; color: var(--gold); font-weight: 800; letter-spacing: .14em; font-size: 20px; white-space: nowrap; }
header .logo img { width: 34px; height: 34px; }
header .logo span small { color: var(--muted); font-size: 13px; letter-spacing: .2em; margin-left: 6px; }
#q { flex: 1; max-width: 520px; margin-left: auto; padding: 9px 12px; background: #0f110c; border: 1px solid var(--line); color: var(--text); font: 500 16px var(--font); }
#menu-btn { display: none; background: var(--panel2); border: 1px solid var(--line); color: var(--text); font: 800 15px var(--font); padding: 7px 10px; }
.wrap { display: flex; max-width: 1280px; margin: 0 auto; }
nav#side { width: 250px; flex: none; padding: 14px 10px 40px; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; border-right: 1px solid var(--line); }
nav#side h4 { margin: 16px 8px 4px; font-size: 12px; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
nav#side a { display: block; padding: 4px 8px; color: var(--text); border-left: 3px solid transparent; font-size: 16px; }
nav#side a.on { border-left-color: var(--gold); background: rgba(217,197,138,.08); color: var(--gold); text-decoration: none; }
main { flex: 1; min-width: 0; padding: 20px 28px 60px; }
h1 { font-size: 34px; margin: 0 0 6px; letter-spacing: .06em; color: var(--gold); line-height: 1.15; }
h2 { font-size: 23px; margin: 28px 0 8px; letter-spacing: .08em; color: var(--text); border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
h3 { font-size: 18px; margin: 18px 0 6px; color: var(--gold); letter-spacing: .06em; }
.lead { color: var(--muted); font-size: 18px; margin-bottom: 14px; }
.box { background: var(--panel); border: 1px solid var(--line); padding: 12px 16px; margin: 12px 0; }
.tip { border-left: 4px solid var(--green); } .warn { border-left: 4px solid var(--red); }
.paper { background: var(--paper); color: var(--ink); padding: 14px 16px; font: 15px/1.6 'Special Elite', 'Courier New', monospace; transform: rotate(-.25deg); box-shadow: 0 3px 8px rgba(0,0,0,.5); margin: 12px 0; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.card { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; color: var(--text); }
.card:hover { background: var(--panel2); text-decoration: none; }
.ico { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: #3a3f2c; border: 1.5px solid #15170f; font-size: 26px; }
.ico img { width: 38px; height: 38px; object-fit: contain; }
.ico.big { width: 96px; height: 96px; font-size: 54px; } .ico.big img { width: 84px; height: 84px; }
.card b { display: block; line-height: 1.2; } .card small { color: var(--muted); font-size: 14px; }
table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 16px; }
th, td { padding: 6px 8px; border-bottom: 1px solid #2c3123; text-align: left; vertical-align: top; }
th { color: var(--gold); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; background: var(--panel2); }
td.n { text-align: right; font-family: var(--mono); white-space: nowrap; }
.tbl { overflow-x: auto; }
.pill { display: inline-block; padding: 0 7px; margin: 2px 3px 2px 0; border: 1px solid var(--line); font-size: 14px; color: var(--text); background: rgba(0,0,0,.2); }
a.pill:hover { border-color: var(--gold); text-decoration: none; }
.pill.g { border-color: #5c6b30; color: #cfe08a; } .pill.r { border-color: #7a3a2e; color: #f0a090; } .pill.y { border-color: #8a7536; color: var(--gold); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
.filters button { background: var(--panel2); border: 1px solid var(--line); color: var(--text); font: 700 14px var(--font); letter-spacing: .08em; padding: 5px 10px; cursor: pointer; }
.filters button.on { background: #59652f; border-color: #0b0c08; }
.head { display: flex; gap: 16px; align-items: center; margin-bottom: 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 10px 0; }
.stat { background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; } .stat small { display: block; color: var(--muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; } .stat b { font-size: 21px; }
.recipe { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; margin: 8px 0; }
.recipe .arrow { color: var(--muted); margin: 0 6px; }
.enemy-img { width: 160px; height: 160px; object-fit: cover; border: 6px solid var(--paper); border-bottom-width: 24px; transform: rotate(-2deg); box-shadow: 0 4px 10px rgba(0,0,0,.6); background: #000; }
.muted { color: var(--muted); } .mono { font-family: var(--mono); }
ol li, ul li { margin: 4px 0; }
.foot { margin-top: 40px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.cta { display: inline-block; margin-top: 8px; padding: 9px 16px; background: #59652f; border: 1px solid #0b0c08; color: var(--text); font-weight: 800; letter-spacing: .14em; }
.cta:hover { text-decoration: none; filter: brightness(1.15); }
.hit { background: rgba(217,197,138,.25); }
@media (max-width: 860px) {
  #menu-btn { display: block; }
  nav#side { display: none; position: fixed; left: 0; top: 56px; z-index: 40; background: #14160f; width: 82vw; box-shadow: 10px 0 30px rgba(0,0,0,.7); }
  body.nav-open nav#side { display: block; }
  main { padding: 16px 14px 50px; } h1 { font-size: 28px; }
  header .logo span { display: none; }
  header { gap: 8px; padding: 8px 10px; } #q { min-width: 0; }
}
</style>
</head>
<body>
<header>
  <button id="menu-btn" onclick="document.body.classList.toggle('nav-open')">☰</button>
  <a class="logo" href="#/"><img src="/icons/icon-192.png" alt=""><span>SURVIVAL GO<small>WIKI</small></span></a>
  <input id="q" type="search" placeholder="Keresés: tárgy, recept, ellenfél, épület…" autocomplete="off">
</header>
<div class="wrap">
  <nav id="side"></nav>
  <main id="main"><p class="muted">Betöltés…</p></main>
</div>

<script src="/js/items.js"></script>
<script src="/js/recipes.js"></script>
<script src="/js/stats.js"></script>
<script src="/js/buildings.js"></script>
<script src="/js/daily.js"></script>
<script src="/js/tutorial.js"></script>
<script src="/js/roles.js"></script>
<script src="/js/shop.js"></script>
<script src="/js/shelter.js"></script>
<script src="/js/advent.js"></script>
<script src="/js/wheel.js"></script>
<script src="/js/winter.js"></script>
<script src="/js/gifts.js"></script>
<script src="/js/quests.js"></script>
<script src="/js/skills.js"></script>
<script src="/js/season.js"></script>
<script>
// =====================================================================================
// A wiki a játék saját adatfájljaiból áll össze (tárgyak, receptek, épületek, napi bónusz, rangok),
// a szabályok és az ellenfelek a szervertől jönnek (/api/wiki) – így minden frissítéssel magától naprakész.
// =====================================================================================
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ITEMS = itemDatabase, RECIPES = window.craftingRecipes || [], B = window.SurvivalBuildings, ST = window.SurvivalStats;
let W = null; // szerver adatai
const pct = (x) => Math.round(x * 100) + '%';
const num = (x) => (Math.round(x * 100) / 100).toLocaleString('hu-HU');

const TYPE_HU = { food: 'Étel', drink: 'Ital', medicine: 'Gyógyszer', weapon: 'Fegyver', helmet: 'Sisak', torso: 'Felső', armor: 'Mellény / páncél', legs: 'Nadrág', shoes: 'Cipő', backpack: 'Hátizsák',
  material: 'Alapanyag', tool: 'Eszköz', mod: 'Fegyvermódosító', ammo: 'Lőszer', valuable: 'Értéktárgy', collectible: 'Gyűjthető', artifact: 'Műtárgy' };
const SLOT_HU = { weapon: 'elsődleges fegyver', secondary: 'másodlagos fegyver (pisztoly)', melee: 'közelharci fegyver', helmet: 'sisak', torso: 'felső', armor: 'mellény', legs: 'nadrág', shoes: 'cipő', backpack: 'hátizsák' };
const GROUP_HU = { grocery: 'élelmiszer', drinks: 'italok', smallgoods: 'apróáru', hardware: 'barkácsáru', tools: 'szerszámok', kitchen: 'konyha', auto: 'autós holmi', medical: 'orvosi', hospital: 'kórházi', police: 'rendőrségi',
  office: 'irodai', fire: 'tűzoltó', military: 'katonai', hazmat: 'vegyvédelmi', household: 'háztartási', culture: 'kulturális', valuables: 'értéktárgyak', sport: 'sport', farm: 'mezőgazdasági', warehouse: 'raktári',
  industrial: 'ipari', scrap: 'roncs és hulladék', utility: 'közmű', cemetery: 'temetői' };
const EFFECT_HU = { hunger: 'Étel', thirst: 'Víz', hp: 'Élet', fatigue: 'Fáradtság' };
const RANKS = [['Újonc', 1], ['Kadét', 5], ['Őrvezető', 10], ['Tizedes', 15], ['Őrmester', 20], ['Törzsőrmester', 25], ['Zászlós', 30], ['Hadnagy', 35], ['Főhadnagy', 40], ['Százados', 45], ['Őrnagy', 50], ['Ezredes', 60], ['Zóna-parancsnok', 75]];
const slug = (s) => String(s).toLocaleLowerCase('hu').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function icon(it, big) {
  if (!it) return `<span class="ico${big ? ' big' : ''}">📦</span>`;
  return `<span class="ico${big ? ' big' : ''}">${it.img ? `<img src="/images/items/${esc(it.img)}.webp" alt="" loading="lazy" onerror="this.outerHTML='${esc(it.icon || '📦')}'">` : esc(it.icon || '📦')}</span>`;
}
const itemLink = (key, count) => { const it = ITEMS[key]; return `<a class="pill" href="#/targy/${key}">${esc(it ? it.name : key)}${count > 1 ? ' ×' + count : ''}</a>`; };
const enemyByKey = (k) => W && W.enemies.find(e => e.key === k);

// ---------- tárgy: hol található, miből készül, mire jó ----------
function rarity(w) { return w >= 8 ? ['gyakori', 'g'] : w >= 4 ? ['közepes', 'y'] : w >= 2 ? ['ritka', 'r'] : ['nagyon ritka', 'r']; }
function whereFound(key) {
  const it = ITEMS[key]; if (!it || !it.loot) return [];
  const groups = Object.entries(it.loot);
  return Object.entries(B.BUILDING_TYPES).map(([name, info]) => {
    const w = groups.filter(([g]) => info.groups.includes(g)).reduce((a, [, x]) => Math.max(a, x), 0);
    return w > 0 ? { name, info, w } : null;
  }).filter(Boolean).sort((a, b) => b.w - a.w);
}
const recipeResult = (r) => r.result || r.key;
const toolList = (r) => (r.tools || []).map(t => Array.isArray(t) ? t : [t]);
function craftedBy(key) { return RECIPES.filter(r => recipeResult(r) === key); }
function usedIn(key) { return RECIPES.filter(r => (r.req && r.req[key]) || toolList(r).some(opts => opts.includes(key) || (key === 'toolbox' && opts.some(o => RecipeTools.TOOLBOX_REPLACES.includes(o))))); }
function droppedBy(key) { return W ? W.enemies.filter(e => e.drops.includes(key)) : []; }
function recipeHtml(r) {
  const res = ITEMS[recipeResult(r)];
  const req = Object.entries(r.req || {}).map(([k, n]) => itemLink(k, n)).join('');
  const tools = toolList(r).map(opts => opts.map(k => itemLink(k)).join('<span class="muted"> vagy </span>')).join(' ');
  const fire = r.fire ? `<span class="pill y">🔥 tűz kell (1 gyufa vagy a tűzgyújtó rúd kopik)</span>` : '';
  const station = r.station ? `<span class="pill r">csak ${r.station === 'workshop' ? 'műhelyben' : 'olvasztóban'} (hamarosan)</span>` : '';
  return `<div class="recipe" id="r-${r.key}"><b>${esc(r.name)}</b> <span class="muted">· ${esc(r.cat || '')}</span><div class="muted" style="font-size:15px">${esc(r.desc || '')}</div>
    <div style="margin-top:4px">${req}<span class="arrow">➜</span>${itemLink(recipeResult(r), r.count || 1)}</div>
    ${tools ? `<div><span class="muted">Szerszám (nem fogy el, de kopik): </span>${tools}</div>` : ''}${fire || station ? `<div>${fire}${station}</div>` : ''}</div>`;
}
function itemFacts(it) {
  const f = [];
  if (it.type) f.push(['Típus', TYPE_HU[it.type] || it.type]);
  const slot = ST.equipSlot(it); if (slot) f.push(['Hely', SLOT_HU[slot] || slot]);
  if (it.tier) f.push(['Szint (tier)', it.tier]);
  if (it.weight !== undefined) f.push(['Súly', num(it.weight) + ' kg']);
  f.push(['Halmozható', it.stackable ? 'igen, egy helyen bármennyi' : 'nem, minden darab külön hely']);
  if (it.dmg) f.push(['Sebzés', '+' + it.dmg]);
  if (it.reqAmmo) f.push(['Lőszer', ITEMS[it.reqAmmo] ? `<a href="#/targy/${it.reqAmmo}">${esc(ITEMS[it.reqAmmo].name)}</a>` : it.reqAmmo]);
  if (it.def) f.push(['Védelem', '+' + it.def + ` (≈ ${num(it.def * (W ? W.combat.DEFENSE_PER_POINT : 0.015) * 100)}% kevesebb sebzés)`]);
  if (it.hpBonus) f.push(['Max élet', '+' + it.hpBonus]);
  if (it.bonusSlots) f.push(['Hátizsák hely', '+' + it.bonusSlots]);
  if (it.maxWeightBonus) f.push(['Teherbírás', '+' + it.maxWeightBonus + ' kg']);
  if (it.fatigueRate !== undefined && it.fatigueRate !== 1) f.push(['Fáradás', it.fatigueRate < 1 ? `${Math.round((1 - it.fatigueRate) * 100)}%-kal lassabban fáradsz` : `${Math.round((it.fatigueRate - 1) * 100)}%-kal gyorsabban fáradsz`]);
  if (it.durability) f.push([it.light ? 'Égési idő' : 'Tartósság', it.light ? it.durability + ' perc (csak éjjel fogy)' : it.durability + ' használat']);
  if (it.light) f.push(['Fényforrás', it.light.fuel ? `igen – lemerüléskor kézzel töltöd újra ezzel: <a href="#/targy/${it.light.fuel}">${esc((ITEMS[it.light.fuel] || {}).name || it.light.fuel)}</a>${it.light.fuel === 'aa_batteries' ? ' (vagy powerbankkal)' : ''}` : 'igen – ha leég, elfogy']);
  if (it.effects) Object.entries(it.effects).forEach(([k, v]) => { if (v) f.push([EFFECT_HU[k] || k, (k === 'fatigue' ? (v < 0 ? `${v} (pihentet)` : `+${v} (fáraszt)`) : (v > 0 ? '+' + v : v))]); });
  if (it.lootCount) f.push(['Egy találatnál', `${it.lootCount[0]}–${it.lootCount[1]} db`]);
  return f;
}

// ---------- útmutató oldalak ----------
const R = () => W.rules;
const GUIDES = [
  { slug: 'kezdolap', title: 'Kezdőlap', group: '', render: home },
  { slug: 'hogyan-kezdj', title: 'Hogyan kezdj hozzá?', group: 'Útmutatók', render: () => `
    <h1>Hogyan kezdj hozzá?</h1><p class="lead">Az első fél órád a Zónában, lépésről lépésre.</p>
    <ol>
      <li><b>Regisztrálj</b> a <a href="/">survivalgo.hu</a> oldalon (${R().usernameMin}–${R().usernameMax} betűs név, 16 év felett). Telefonon a Menü → „Letöltés a telefonra” gombbal alkalmazásként is felteheted.</li>
      <li><b>Engedélyezd a helymeghatározást.</b> A pálya a valódi környezeted: a térképen a körülötted lévő épületek látszanak.</li>
      <li><b>Nézd meg a kezdőcsomagod</b> a Készletben: ${R().starterKit.map(s => itemLink(s.key, s.count)).join('')}</li>
      <li><b>Menj oda egy épülethez</b> (${R().lootRangeMeters} méteren belülre), koppints rá, és kutasd át. Ez az <a href="#/oldal/epuletek-es-kutatas">átkutatás</a>.</li>
      <li><b>Figyeld a csíkokat</b> alul: élet, étel, víz, erő. Ha valamelyik fogy, egyél, igyál, pihenj. Lásd: <a href="#/oldal/tuleles">Túlélés alapjai</a>.</li>
      <li><b>Csináld végig az Első lépéseket</b> (Küldetés gomb): hat egyszerű feladat, a végén jutalommal. Lásd: <a href="#/oldal/elso-lepesek">Első lépések</a>.</li>
      <li><b>Gyere vissza minden nap</b> a <a href="#/oldal/napi-bonusz">napi bónuszért</a>.</li>
    </ol>
    <div class="box tip">💡 <b>Tipp:</b> az első napokban a lakóházak, kisboltok és élelmiszerboltok a legbiztonságosabbak. A katonai bázisok és bunkerek veszélyesek: oda erősebb felszereléssel menj.</div>
    <div class="box warn">⚠️ <b>Figyelj a forgalomra!</b> Játék közben is nézz fel a telefonról, ne menj magánterületre vagy veszélyes helyre egy épület miatt.</div>` },
  { slug: 'tuleles', title: 'Túlélés alapjai', group: 'Útmutatók', render: () => `
    <h1>Túlélés alapjai</h1><p class="lead">Élet, étel, víz és erő – a négy csík a képernyő alján.</p>
    <h2>❤️ Élet</h2>
    <p>Ha 0-ra csökken, a karaktered meghal (lásd <a href="#/oldal/halal">Halál és újrakezdés</a>). Az alap maximum ${R().base.maxHp}, szintenként +${R().hpPerLevel}, és egyes felszerelések is növelik.</p>
    <p><b>Magától visszatöltődik</b>, ha az étel ÉS a víz is ${R().regenAbovePercent}% felett van: 0-ról tele kb. ${R().regenFullMinutes} perc alatt. Gyorsabban gyógyítanak a <a href="#/targyak/medicine">gyógyszerek és kötszerek</a>. Szintlépéskor teljesen meggyógyulsz.</p>
    <h2>🥫 Étel és 💧 víz</h2>
    <p>Folyamatosan fogynak, akkor is, ha nem játszol: a teli étel-csík kb. ${R().hungerFullMinutes / 60} óra, a víz kb. ${R().thirstFullMinutes / 60} óra alatt ürül ki.</p>
    <div class="box warn">Ha az egyik csík 0, a teljes életed kb. <b>${R().starveOneMinutes} perc</b> alatt elfogy. Ha mindkettő 0, kb. <b>${R().starveBothMinutes} perc</b> alatt. ${R().warnBelowPercent}% alatt a játék figyelmeztet.</div>
    <p>Ételt a boltokban, konyhákban, házakban találsz, vizet és italokat szinte mindenhol. A szennyezett vizet <a href="#/receptek/viz-es-etel">szűrd vagy forrald fel</a>.</p>
    <h2>⚡ Erő (fáradtság)</h2>
    <p>Az ERŐ csík azt mutatja, mennyire vagy kipihent. Fáradsz:</p>
    <ul><li>gyaloglástól: kilométerenként kb. ${R().fatiguePerKm}%,</li><li>épület átkutatásától: +${R().fatigueLoot}%,</li><li>harctól: +${R().fatigueCombat}%,</li><li>túlsúlytól (lásd <a href="#/oldal/suly">Súly és hátizsák</a>).</li></ul>
    <p><b>Pihenés:</b> ha ${R().restIdleMinutes} percig egy helyben állsz, vagy kilépsz a játékból, pihensz: teljesen kimerültről kb. ${R().fatigueFullRestMinutes} perc alatt pihened ki magad. A kávé, energiaital és energiaszelet is segít.</p>
    <div class="box">Fáradtan rosszabbul harcolsz: 60% fáradtság felett −15% sebzés és nehezebb menekülés, 85% felett −30% sebzés.</div>` },
  { slug: 'mozgas', title: 'Mozgás, GPS és XP', group: 'Útmutatók', render: () => `
    <h1>Mozgás, GPS és tapasztalat</h1>
    <p>A karaktered ott van, ahol te: a játék a telefonod GPS-ét használja. Minden <b>${R().moveXpMeters} megtett méter +1 XP</b>. A ${pills(['pocket_compass', 'topo_map'])} egyenként +${pct(R().walkXpBonusPerItem)} gyaloglási XP-t ad, ha nálad van.</p>
    <ul>

  { slug: 'epuletek-es-kutatas', title: 'Épületek és átkutatás', group: 'Útmutatók', render: () => `
    <h1>Épületek és átkutatás</h1><p class="lead">A zsákmány nagy része az épületekből jön. Minden valódi épület a térképen egy kifosztható hely.</p>

      <li>Menj ${R().lootRangeMeters} méteren belülre (a GPS pontatlansága miatt egy kis ráhagyás van).</li>

    <h2>Üres épületek és veszély</h2>
    <p>Minden épülettípusnak van esélye, hogy üres, és hogy ellenség vár bent. Az <a href="#/targy/lockpick">álkulcs</a> nálad tartva ${pct(1 - R().lockpickEmptyFactor)}-kal csökkenti az üres épület esélyét (kutatásonként kopik 1-et). Ha harcot nyersz egy épületben, utána feleakkora eséllyel üres.</p>
    <p>Az összes épülettípus a veszélyességgel és a zsákmánnyal: <a href="#/epuletek">Épületek</a>.</p>` },
  { slug: 'harc', title: 'Harc és menekülés', group: 'Útmutatók', render: () => `
    <h1>Harc és menekülés</h1><p class="lead">Az épületekben néha ellenség vár. Körökre osztott harc: te választasz, mit teszel.</p>
    <h2>A lehetőségeid minden körben</h2>
    <ul><li><b>Támadás</b> a felvett fegyvereid egyikével (elsődleges, másodlagos vagy közelharci). A fegyverváltás nem vesz el kört.</li>
      <li><b>Gyógyulás</b> egy orvosi szerrel a hátizsákodból.</li>
      <li><b>Menekülés</b>: alapesetben ${pct(W.combat.FLEE_CHANCE)} eséllyel sikerül (fáradtan kevesebb). Sikeres menekülésnél nincs zsákmány, és az épület ${R().fleeLockMinutes} percig neked zárva.</li></ul>
    <h2>Sebzés</h2>
    <ul><li>Fegyver nélkül ${W.combat.UNARMED_DMG}, lőfegyverrel lőszer nélkül ${W.combat.NO_AMMO_DMG} a sebzés (puskatussal ütsz).</li>
      <li>${W.combat.LEVEL_DMG_BONUS ? `Szintenként +${W.combat.LEVEL_DMG_BONUS} sebzés, minden` : 'A szint nem ad sebzést (a <a href="#/oldal/kepessegek">Harcos ág képességei</a> igen). Minden'} ütéshez +0–${W.combat.DMG_RANDOM} véletlen.</li>
      <li>${pct(W.combat.CRIT_CHANCE)} esély kritikus találatra (${W.combat.CRIT_MULT}× sebzés).</li>
      <li>A lőfegyver lövésenként 1 lőszert visz el; ${pct(W.combat.CASING_CHANCE)} eséllyel visszakapod az üres hüvelyt (abból <a href="#/receptek/loszer">lőszert tölthetsz</a>).</li>
      <li><b>Védelem:</b> pontonként ${num(W.combat.DEFENSE_PER_POINT * 100)}% kevesebb sebzést kapsz, legfeljebb ${pct(W.combat.DEFENSE_CAP)}.</li></ul>
    <h2>Győzelem</h2>

  { slug: 'ejszaka', title: 'Éjszaka és fény', group: 'Útmutatók', render: () => `
    <h1>Éjszaka és fény</h1><p class="lead">Az éjszaka a valódi napnyugtától a napkeltéig tart, a helyedhez igazítva.</p>

      <li>Éjjel megjelenhet az <a href="#/ellenfel/shade">Árnyék</a>, és a ghoulok meg a kutyafalkák gyakoribbak.</li></ul>

    <div class="grid">${Object.entries(ITEMS).filter(([, it]) => it.light).map(([k, it]) => card(k, it, it.light.fuel ? 'újratölthető' : it.durability + ' percig ég')).join('')}</div>` },
  { slug: 'barkacs', title: 'Barkácsolás', group: 'Útmutatók', render: () => `
    <h1>Barkácsolás</h1><p class="lead">A Barkács gombbal a talált holmiból jobb dolgokat készíthetsz: kötszert, tiszta vizet, fegyvert, lőszert, fényt, ruhát.</p>
    <ul><li>Az <b>alapanyagok</b> elfogynak.</li>

      <li>Ahol <b>tűz</b> kell, ott 1 gyufásdoboz fogy el, vagy a tűzgyújtó rúd kopik (előbb a gyufát használja).</li>

  { slug: 'felszereles', title: 'Felszerelés, kopás, javítás', group: 'Útmutatók', render: () => `

      <li>A felszerelés <b>kopik</b>: a fegyver és a páncél harcban, a cipő gyaloglással (${R().shoeWearMeters / 1000} km-enként 1). Ha tönkremegy, rajtad marad, de nem ad bónuszt.</li></ul>

  { slug: 'suly', title: 'Súly és hátizsák', group: 'Útmutatók', render: () => `
    <h1>Súly és hátizsák</h1>
    <ul><li>Alapból <b>${R().base.slots} hely</b> és <b>${R().base.maxWeight} kg</b> teherbírás. A hátizsákok és egyes ruhák növelik.</li>
      <li>A halmozható tárgyakból (étel, lőszer…) egy helyen bármennyi elfér; a nem halmozhatók (fegyver, ruha) darabonként egy helyet foglalnak.</li>

    <p>Hátizsákok: <a href="#/targyak/backpack">mind</a>.</p>` },
  { slug: 'halal', title: 'Halál és újrakezdés', group: 'Útmutatók', render: () => `
    <h1>Halál és újrakezdés</h1>

  { slug: 'szintek-es-rangok', title: 'Szintek és rangok', group: 'Útmutatók', render: () => `

  { slug: 'elso-lepesek', title: 'Első lépések (küldetés)', group: 'Útmutatók', render: () => `

  { slug: 'napi-bonusz', title: 'Napi bónusz', group: 'Útmutatók', render: () => `

  { slug: 'kuldetesek', title: 'Napi és heti küldetések', group: 'Útmutatók', render: () => {
    const Q = window.SurvivalQuests, D = Q.DEFS;

    const list = (scope, move) => Object.keys(D).filter(k => D[k].scope === scope && D[k].move === move).map(row).join('');
    return `<h1>📜 Napi és heti küldetések</h1>

    <ul><li>Naponta 2 mozgásos + 1 otthon is teljesíthető, hetente 3 mozgásos + 1 otthoni küldetés jár.</li>
      <li>A jutalom (XP és pénz) azonnal jár, amint teljesíted. Ha mind a 3 napi kész: <b>+${Q.DAILY_BONUS.xp} XP, +${Q.DAILY_BONUS.money} $</b> (decemberben +1 pörgetés is). Ha mind a 4 heti: <b>+${Q.WEEKLY_BONUS.xp} XP, +${Q.WEEKLY_BONUS.money} $</b>.</li>
      <li>Az új napi küldetések éjfélkor, a hetiek hétfőn jönnek (magyar idő szerint).</li>
      <li><b>Csere:</b> naponta egy napi küldetést lecserélhetsz (pl. ha nincs vasútállomás a környékeden).</li>
      <li>A nehézség a szinteddel nő: 1–9. / 10–24. / 25+. szint.</li>
      <li>❄️ <b>A Fagyos Csend alatt</b> (dec. 1. – jan. 6.) a mozgásos küldetések egyike mindig téli: díszt akasztani egy karácsonyfára, hétvégén ajándékcsomagot keresni. Néha az otthoni is: adventi ablak vagy díszbarkácsolás.</li></ul>
    <h2>🧭 Felfedező bónusz</h2>
    <p>A térkép kb. 500 méteres területekre oszlik. Minden olyan terület, ahol a játékkal még sosem jártál, <b>+${Q.EXPLORE_XP} XP</b>-t ér (naponta legfeljebb ${Q.EXPLORE_XP_DAILY_MAX} területig).</p>
    <h2>🏠 Mi számít „otthonnak”?</h2>
    <p>A <a href="#/oldal/menedek">menedéked</a>, vagy ha még nincs, az a terület, ahol a legtöbbet kutatsz. A „messze otthonról” küldetéseknél ettől mérjük a távolságot.</p>
    <div class="box tip"><b>Csak gyalog!</b> Járműből (${'15 km/h'} fölött) a megtett út nem számít, és a GPS-ugrások sem.</div>
    <h2>Napi küldetések</h2>
    <div class="tbl"><table><tr><th>Mozgásos</th><th>Cél (szint szerint)</th><th>Jutalom</th></tr>${list('daily', true)}</table></div>
    <div class="tbl"><table><tr><th>Otthon is megy</th><th>Cél</th><th>Jutalom</th></tr>${list('daily', false)}</table></div>
    <h2>Heti küldetések</h2>
    <div class="tbl"><table><tr><th>Mozgásos</th><th>Cél (szint szerint)</th><th>Jutalom</th></tr>${list('weekly', true)}</table></div>
    <div class="tbl"><table><tr><th>Otthon is megy</th><th>Cél</th><th>Jutalom</th></tr>${list('weekly', false)}</table></div>`;
  } },
  { slug: 'kepessegek', title: 'Képességek', group: 'Útmutatók', render: () => {

  { slug: 'kozosseg', title: 'Barátok, csapatok, meghívás', group: 'Útmutatók', render: () => `
    <h1>👥 Barátok, csapatok, meghívás</h1>

    <ul><li>Barátot a nevével jelölhetsz, vagy koppints rá egy játékosra a térképen → <b>Barátnak jelölöm</b>. Ha elfogadja, a barátod lesz.</li>
      <li>Látod, ki van online, hányadik szinten jár, és hány km-t gyalogolt, hány szezonpontot gyűjtött a hónapban.</li>
      <li><b>Napi ajándék:</b> minden barátodnak naponta 1 ajándékot küldhetsz (kötszer, konzerv, víz, elem vagy rongy), összesen naponta 5-öt. Ha nincs nála hely, a menedéke raktárába kerül.</li>
      <li>A barátaid jelölője a térképen <b>arany keretet</b> kap, ha a közeledben járnak. A pontos helyüket továbbra sem látod, csak ha a közeledben vannak.</li></ul>
    <h2>🏕️ Csapat</h2>
    <ul><li>Csapatot a 3. szinttől alapíthatsz: név, 2–4 betűs rövidítés (pl. <b>[ÉRD]</b>) és <b>címer</b> (32 jelkép, 12 szín, 4 forma). Legfeljebb 15 tag lehet benne.</li>
      <li><b>Csapatkereső:</b> Barátok → Csapat → 🔎 Csapatkereső. Név vagy rövidítés alapján keresel (ékezet nélkül is megtalálja). Egyszerre legfeljebb 3 csapathoz jelentkezhetsz.</li>
      <li>A csatlakozás módját a vezető állítja: <b>nyitott</b> (bárki azonnal beléphet), <b>jelentkezéssel</b> (a vezető vagy a helyettes fogad el) vagy <b>zárt</b> (csak meghívóval). Minimum szintet is megadhat.</li>
      <li>Meghívni bármelyik tag tud a játékos nevével vagy a barátlistáról (zárt csapatban csak a vezető és a helyettes). A térképen egy játékosra koppintva is meghívhatod.</li></ul>

      <li><b>⭐ Helyettes:</b> felveszi a jelentkezőket, elküldheti a sima tagokat, kitűzhet a hirdetőtáblára, és módosíthatja a címert és a leírást.</li>
      <li><b>Tag:</b> meghívhat, csevegőt használ, és segít a heti küldetésekben.</li>
      <li>Ha a vezető kilép, a helyettes (ha nincs, a legrégebbi tag) lesz az új vezető.</li></ul>

      <li>Tagonként: 25 km séta, 50 épület, 15 győzelem, 30 új terület, 15 barkácsolás vagy 15 egyéni küldetés. A cél minden taggal nő, de legalább 3 főre számol (15 fős csapatnak például 375 km séta a heti cél).</li>
      <li><b>Csapatmunka:</b> egy küldetés csak akkor teljesül, ha elég különböző tag segít benne: 2 fős csapatban mindkettő, 3–9 főnél 3, 10–12 főnél 4, 13–15 főnél 5 tag. Egyedül nem lehet megcsinálni.</li>
      <li>Jutalom: a közös sétáért <b>+250 XP és 150 $</b>, a többiért <b>+150 XP és 100 $</b>, mind a háromért még <b>+300 XP és 200 $</b>.</li>

      <li>Decemberben a karácsonyfák ablakában a fát is megoszthatod: hívd oda a többieket díszíteni!</li>

      <li>Ha benézel a közösségi oldalainkra (Discord, Facebook, Instagram, TikTok…), platformonként egyszer <b>+100 XP és 100 $</b> jár.</li>
      <li>A legszebb fák listája bejelentkezés nélkül is megnézhető és megosztható: <a href="/fak">survivalgo.hu/fak</a>.</li></ul>` },

  return `<h1>Ellenfelek</h1><p class="lead">Ők várnak rád az épületekben. A szintjük a veszélyességüket jelzi; erős ellenfél csak magasabb szintű játékosnál jön gyakrabban.</p>
    <div class="tbl"><table><tr><th></th><th>Ellenfél</th><th>Szint</th><th>Élet</th><th>Ütés</th><th>Jutalom</th><th>Hol?</th></tr>
    ${list.map(e => `<tr><td><a href="#/ellenfel/${e.key}"><img src="/images/enemies/${e.key}.webp" alt="" style="width:54px;height:54px;object-fit:cover;border:2px solid var(--paper)" onerror="this.outerHTML='${e.avatar}'"></a></td>
      <td><a href="#/ellenfel/${e.key}"><b>${esc(e.name)}</b></a>${e.night ? ' <span class="pill r">csak éjjel</span>' : e.nightWeight > 1 ? ' <span class="pill y">éjjel gyakoribb</span>' : ''}</td>
      <td class="n">${e.lvl}</td><td class="n">${e.hp}</td><td class="n">${e.dmg}</td><td class="n">${e.xp} XP · ${e.money[0]}–${e.money[1]} $</td>
      <td>${e.night && !e.habitat.length ? 'éjjel bárhol' : e.habitat.map(g => GROUP_HU[g] || g).join(', ')}</td></tr>`).join('')}</table></div>
    <p class="muted">Az ütés az ellenfél alapsebzése (±${pct(W.combat.ENEMY_VARIANCE)}), a védelmed csökkenti.</p>`;
}
function enemyPage(key) {
  const e = enemyByKey(key); if (!e) return notFound();
  const where = Object.entries(B.BUILDING_TYPES).filter(([, i]) => i.groups.some(g => e.habitat.includes(g)));
  return `<div class="head"><img class="enemy-img" src="/images/enemies/${e.key}.webp" alt="" onerror="this.style.display='none'"><div><h1>${e.avatar} ${esc(e.name)}</h1><div class="muted">Veszélyességi szint: ${e.lvl}</div></div></div>
    <div class="stats"><div class="stat"><small>Élet</small><b>${e.hp}</b></div><div class="stat"><small>Ütés</small><b>${e.dmg}</b></div><div class="stat"><small>XP</small><b>${e.xp}</b></div><div class="stat"><small>Pénz</small><b>${e.money[0]}–${e.money[1]} $</b></div></div>
    ${e.night ? '<div class="box warn">🌙 Csak éjjel jelenik meg – bármelyik épületben. Fény és jó felszerelés nélkül kerüld!</div>' : e.nightWeight > 1 ? `<div class="box">🌙 Éjjel ${e.nightWeight}× gyakoribb.</div>` : ''}
    <h2>Mit hagyhat hátra?</h2><p>${pct(W.combat.DROP_CHANCE)} eséllyel egyet ezek közül: ${e.drops.map(k => itemLink(k)).join('')}</p>
    <h2>Hol találkozhatsz vele?</h2><p>${where.length ? where.map(([n, i]) => `<a class="pill" href="#/epulet/${slug(n)}">${i.icon} ${esc(n)}</a>`).join('') : 'Éjjel bárhol.'}</p>
    <p><a href="#/oldal/harc">→ Hogyan működik a harc?</a></p>`;
}
function buildingsPage() {
  const list = Object.entries(B.BUILDING_TYPES).sort((a, b) => a[1].encounter - b[1].encounter || a[0].localeCompare(b[0], 'hu'));
  return `<h1>Épületek</h1><p class="lead">A térkép épületeit a valódi térképadatokból (OpenStreetMap) sorolja be a játék. Minden típusnak más a zsákmánya és a veszélye.</p>
    <div class="tbl"><table><tr><th>Épület</th><th>Átkutatás</th><th>Üres esély</th><th>Veszély</th><th>Mit találsz?</th></tr>
    ${list.map(([n, i]) => `<tr><td><a href="#/epulet/${slug(n)}">${i.icon} <b>${esc(n)}</b></a></td><td class="n">${B.searchSeconds(n)} mp</td><td class="n">${pct(i.empty)}</td><td class="n">${pct(i.encounter)}</td><td>${i.groups.map(g => GROUP_HU[g] || g).join(', ')}</td></tr>`).join('')}</table></div>`;
}
function buildingPage(sl) {
  const entry = Object.entries(B.BUILDING_TYPES).find(([n]) => slug(n) === sl); if (!entry) return notFound();
  const [name, info] = entry;
  const table = B.lootTable(name, ITEMS).sort((a, b) => b[1] - a[1]);
  const total = table.reduce((a, [, w]) => a + w, 0) || 1;
  const enemies = W.enemies.filter(e => e.habitat.some(g => info.groups.includes(g)));
  return `<h1>${info.icon} ${esc(name)}</h1>
    <div class="stats"><div class="stat"><small>Átkutatás</small><b>${B.searchSeconds(name)} mp</b></div><div class="stat"><small>Üres esély</small><b>${pct(info.empty)}</b></div><div class="stat"><small>Ellenség esély</small><b>${pct(info.encounter)}</b></div><div class="stat"><small>Zsákmány</small><b>${info.groups.map(g => GROUP_HU[g] || g).join(', ')}</b></div></div>
    <h2>Ellenfelek itt</h2><p>${enemies.map(e => `<a class="pill" href="#/ellenfel/${e.key}">${e.avatar} ${esc(e.name)}</a>`).join('') || '–'} <a class="pill r" href="#/ellenfel/shade">👤 éjjel: Árnyék</a></p>
    <h2>Mit találhatsz? (${table.length} tárgy)</h2><p class="muted">A százalék azt mutatja, egy-egy talált tárgy mekkora eséllyel ez.</p>
    <div class="grid">${table.map(([k, w]) => card(k, ITEMS[k], (100 * w / total).toFixed(1) + '%')).join('')}</div>`;
}
function notFound() { return '<h1>Nincs ilyen oldal</h1><p><a href="#/">← Vissza a kezdőlapra</a></p>'; }

// ---------- keresés ----------
function searchPage(q) {
  const n = (s) => String(s).toLocaleLowerCase('hu').normalize('NFD').replace(/[̀-ͯ]/g, '');
  const t = n(q);
  const items = Object.entries(ITEMS).filter(([k, it]) => n(it.name).includes(t) || n(it.desc || '').includes(t) || k.includes(t));
  const recs = RECIPES.filter(r => n(r.name).includes(t) || n(r.desc || '').includes(t));
  const ens = W.enemies.filter(e => n(e.name).includes(t));
  const bs = Object.keys(B.BUILDING_TYPES).filter(x => n(x).includes(t));
  const gs = GUIDES.filter(g => n(g.title).includes(t));
  return `<h1>Keresés: „${esc(q)}”</h1>
    ${gs.length ? `<h2>Útmutatók</h2><p>${gs.map(g => `<a class="pill" href="#/oldal/${g.slug}">📖 ${g.title}</a>`).join('')}</p>` : ''}
    ${ens.length ? `<h2>Ellenfelek</h2><p>${ens.map(e => `<a class="pill" href="#/ellenfel/${e.key}">${e.avatar} ${esc(e.name)}</a>`).join('')}</p>` : ''}
    ${bs.length ? `<h2>Épületek</h2><p>${bs.map(x => `<a class="pill" href="#/epulet/${slug(x)}">${B.BUILDING_TYPES[x].icon} ${esc(x)}</a>`).join('')}</p>` : ''}
    ${items.length ? `<h2>Tárgyak (${items.length})</h2><div class="grid">${items.slice(0, 60).map(([k, it]) => card(k, it)).join('')}</div>` : ''}
    ${recs.length ? `<h2>Receptek (${recs.length})</h2>${recs.slice(0, 30).map(recipeHtml).join('')}` : ''}
    ${!items.length && !recs.length && !ens.length && !bs.length && !gs.length ? '<p class="muted">Nincs találat.</p>' : ''}`;
}

// ---------- oldalsáv és útválasztás ----------
function renderNav(active) {
  const groups = {};
  GUIDES.forEach(g => { const k = g.group || ''; (groups[k] = groups[k] || []).push(g); });
  const a = (href, label) => `<a href="${href}" class="${active === href ? 'on' : ''}">${label}</a>`;
  $('side').innerHTML = a('#/', '🏠 Kezdőlap') +
    Object.entries(groups).filter(([k]) => k).map(([k, list]) => `<h4>${k}</h4>` + list.map(g => a('#/oldal/' + g.slug, g.title)).join('')).join('') +
    `<h4>Adatbázis</h4>` + a('#/targyak', '🎒 Tárgyak') + a('#/receptek', '🔧 Receptek') + a('#/ellenfelek', '🧟 Ellenfelek') + a('#/epuletek', '🏚️ Épületek') +
    `<h4>Egyéb</h4><a href="/">▶ Vissza a játékhoz</a><a href="/adatvedelem.html">Adatkezelés</a>`;
}
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, '')) || '/';
  const [, p1, p2] = h.split('/');
  let html, active = '#' + h;
  if (!W) return;
  if (!p1) { html = home(); active = '#/'; }
  else if (p1 === 'oldal') { const g = GUIDES.find(x => x.slug === p2); html = g ? g.render() : notFound(); }
  else if (p1 === 'targyak') { html = itemsPage(p2 || ''); active = '#/targyak'; }
  else if (p1 === 'targy') { html = itemPage(p2); active = '#/targyak'; }
  else if (p1 === 'receptek') { html = recipesPage(p2 || ''); active = '#/receptek'; }
  else if (p1 === 'ellenfelek') html = enemiesPage();
  else if (p1 === 'ellenfel') { html = enemyPage(p2); active = '#/ellenfelek'; }
  else if (p1 === 'epuletek') html = buildingsPage();
  else if (p1 === 'epulet') { html = buildingPage(p2); active = '#/epuletek'; }
  else if (p1 === 'kereses') html = searchPage(p2 || '');
  else html = notFound();
  $('main').innerHTML = html + `<div class="foot">A wiki a játék saját adataiból készül, ezért mindig naprakész. Hibát találtál? Írj nekünk a játékban (Menü → Üzenet a stábnak) vagy az <a href="mailto:info@survivalgo.hu">info@survivalgo.hu</a> címre.</div>`;
  renderNav(active);
  document.body.classList.remove('nav-open');
  if (p1 !== 'kereses') window.scrollTo(0, 0);
  const title = $('main').querySelector('h1');
  document.title = (title ? title.textContent + ' – ' : '') + 'Survival GO Wiki';
}
let qt = null;
$('q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(() => { const v = $('q').value.trim(); if (v.length >= 2) location.hash = '#/kereses/' + encodeURIComponent(v); else if (!v && location.hash.startsWith('#/kereses')) location.hash = '#/'; }, 250); });
window.addEventListener('hashchange', route);
fetch('/api/wiki').then(r => r.json()).then(d => { W = d; route(); }).catch(() => { $('main').innerHTML = '<h1>Nem sikerült betölteni</h1><p>Ellenőrizd az internetkapcsolatot, és frissítsd az oldalt.</p>'; });
</script>
</body>
</html>
